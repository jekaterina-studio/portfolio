biography: |-
  My professional journey began at the intersection of communication and visual arts, gradually expanding into cultural project development, marketing and project coordination.

  I have worked across creative and corporate environments, navigating different sectors and contexts. My experience includes social media strategies, editorial development and research in the field of education. I have conceived, developed and organised content, narratives, processes and projects, overseeing their planning and production. I have often found myself at the intersection of ideas, people and possibilities.

  Understanding the context and recognising opportunities. That's where I would start, every time.

  I will always choose open dialogue because I value direct communication. I believe teamwork should do more than bring different skills together; it should create opportunities for them to meet and complement one another, through openness and an appreciation of individual differences.
