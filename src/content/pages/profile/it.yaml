biography: |-
  Il mio percorso prende forma tra comunicazione e arti visive, per poi estendersi alla progettazione culturale, al marketing e al coordinamento di progetti.

  Mi sono mossa tra realtà creative e aziendali, attraversando settori e contesti diversi. Ho lavorato su strategie social media, sviluppo editoriale e ricerca in ambito educativo. Ho ideato, elaborato e organizzato contenuti, narrazioni, processi e progetti, seguendone la pianificazione e la produzione. Spesso mi sono trovata nel punto d'incontro tra idee, persone e possibilità.

  Leggere il contesto e riconoscere le opportunità. Partirei da questo, ogni volta.

  Sceglierei sempre il confronto aperto, perché mi piace la comunicazione diretta. Credo che il lavoro di squadra non debba soltanto mettere insieme competenze diverse, ma farle incontrare. Attraverso l'apertura e il riconoscimento delle differenze dell'altro.
