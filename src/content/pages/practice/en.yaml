# Approved British English copy.
intro: |-
  In my working approach, I start by understanding the context and gathering the information needed to move forward. Before developing a proposal, I consider the objectives, available resources, constraints and people involved.

  I define a direction, organise activities and translate objectives into concrete steps. Throughout the process, I monitor progress, gather feedback and adapt the work whenever necessary. The process is not rigid: it evolves according to the nature and requirements of each project.

  When working in a team, I consider clear communication, shared information and collaboration between different areas of expertise essential. I enjoy working in environments where people can exchange ideas openly, take responsibility and contribute to a shared direction. I believe in a practical and collaborative approach, where discussion helps solve problems and move work forward.
steps:
- title: observe
  text: understand the context, brief and requirements.
- title: research
  text: gather information, analyse the situation and identify opportunities.
- title: define
  text: establish objectives, priorities and direction.
- title: plan
  text: organise activities, timelines, resources and responsibilities.
- title: develop
  text: translate ideas into content, materials and actions.
- title: coordinate
  text: oversee execution, involve people and manage activities.
- title: review
  text: evaluate results and feedback, and identify next steps.
