title: Narrative development OFFLab
description: Contribution to the development of an educational and urban green design project, from initial research to the funding application. Activities included researching potential school locations in Milan, site visits, developing educational programmes for children, content related to the UN 2030 Agenda and preparing an approximately 100-page editorial booklet.
results: The project secured €80,000 in funding from Fondazione Cariplo through the ExtraBando programme and is ongoing.
