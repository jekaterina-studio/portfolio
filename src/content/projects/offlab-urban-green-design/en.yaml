title: Narrative development for OFFLab
description: 'OFFLab is an urban green design project by Aedo, dedicated to active citizenship, sustainability and biodiversity, with an educational design component aimed at schools. Funded in 2019 through Fondazione Cariplo''s ExtraBando programme, the project needed a graphic and narrative identity able to communicate its purpose.'
role: 'I worked on the narrative and identity development of the project, translating its content and objectives into a system of visual and editorial communication. I handled the research, selection and acquisition of images and the development of graphic concepts for promoting the project.'
results: 'An editorial booklet of approximately 100 pages for the Milan Patent Office.'
