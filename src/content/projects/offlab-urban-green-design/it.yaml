title: Identità visiva e narrativa di OFFLab
description: 'OFFLab è un progetto di Aedo dedicato all''urban green design, alla sostenibilità ambientale, alla cittadinanza attiva e alla biodiversità, con una componente di progettazione educativa rivolta alle scuole. Per promuoverne lo sviluppo e comunicarne obiettivi e potenzialità, è stato necessario costruire un''identità narrativa e visiva capace di restituirne la complessità e renderla comprensibile a interlocutori diversi.'
role: Communication and Project Assistant
activities:
- Mi sono occupata dello sviluppo narrativo e identitario del progetto, traducendone i contenuti e gli obiettivi in un sistema di comunicazione visiva ed editoriale.
- Ho realizzato e acquisito i materiali fotografici originali per documentare il progetto e il suo sviluppo, oltre a occuparmi dello sviluppo dei concept grafici e dei materiali di presentazione.
- Ho inoltre contribuito alla preparazione di presentazioni rivolte a interlocutori tecnici, istituzionali e potenziali finanziatori, pensate per accompagnare gli incontri di promozione e sviluppo del progetto.
results: 'Il prodotto editoriale finale, depositato presso l''Ufficio Brevetti di Milano a corredo del progetto di ingegneria edile.'
