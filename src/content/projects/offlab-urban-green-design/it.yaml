title: Narrative development per OFFLab
description: 'OFFLab è un progetto di Aedo di urban green design, dedicato alle pratiche di cittadinanza attiva, sostenibilità e biodiversità, con una componente di progettazione educativa rivolta alle scuole. Finanziato nel 2019 attraverso ExtraBando di Fondazione Cariplo, il progetto necessitava di un''identità grafica e narrativa capace di comunicarne la propria vocazione.'
roleLabel: attività svolte
role: 'Mi sono occupata dello sviluppo narrativo e identitario del progetto, traducendone i contenuti e gli obiettivi in un sistema di comunicazione visiva ed editoriale. Ho curato la ricerca, la selezione e l''acquisizione delle immagini e lo sviluppo dei concept grafici destinati alla promozione del progetto.'
results: 'Booklet editoriale di circa 100 pagine destinato all''Ufficio Brevetti di Milano.'
