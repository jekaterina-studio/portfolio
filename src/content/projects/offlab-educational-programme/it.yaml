description: 'OFFLab è un progetto di Aedo dedicato all''urban green design, alla sostenibilità e alla biodiversità, con una componente educativa rivolta alle scuole e ai futuri change makers. Il progetto sviluppa percorsi di apprendimento per avvicinare i bambini ai temi dell''ambiente urbano e delle relazioni tra natura, territorio e comunità, attraverso metodologie di educazione esperienziale, strumenti didattici e pratiche di cittadinanza attiva, in linea con gli Obiettivi dell''Agenda 2030.'
