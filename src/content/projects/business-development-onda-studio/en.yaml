title: Collaboration with Onda Studio
description: |-
  Onda Studio is an independent new media art studio based in Monza with an international outlook, specialising in the development and production of audiovisual projects, immersive installations and interactive experiences.

  I worked with the studio on its business development and on strengthening its institutional presence, managing corporate communication, developing editorial and multichannel strategies, and carrying out research and outreach. The work involved both promoting the studio's identity and projects and identifying new opportunities, contacts and collaboration contexts at national and international level.
