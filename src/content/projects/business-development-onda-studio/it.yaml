title: Collaborazione con Onda Studio
description: |-
  Onda Studio è uno studio indipendente di new media art con sede a Monza e una dimensione internazionale, specializzato nello sviluppo e nella produzione di progetti audiovisivi, installazioni immersive ed esperienze interattive.

  Ho collaborato con lo studio contribuendo allo sviluppo commerciale e al consolidamento della sua presenza istituzionale, attraverso la gestione della comunicazione aziendale, lo sviluppo di strategie editoriali e multicanale e attività di ricerca e outreach. Il lavoro ha riguardato sia la valorizzazione dell'identità e dei progetti dello studio, sia l'individuazione di nuove opportunità, interlocutori e contesti di collaborazione a livello nazionale e internazionale.
activities:
- ricerca e sviluppo di opportunità internazionali
- sviluppo, scrittura e coordinamento di candidature progettuali
- preparazione di proposte e materiali di presentazione
- sviluppo commerciale e ricerca di partnership
- sviluppo di relazioni con potenziali partner e committenti
