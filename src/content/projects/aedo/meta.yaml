  format: portrait
  images:
  - file: ../../../assets/images/projects/aedo/aedo-02-ricerca.jpg
    alt:
      it: 'Mano che posiziona un supporto trasparente su un violino storico, illuminato da un puntatore laser rosso.'
      en: 'Hand placing a transparent support on a historic violin, lit by a red laser pointer.'
    caption:
      it: 'Progetti tra patrimonio culturale, ricerca e tecnologia: una complessità da tradurre in un racconto chiaro.'
      en: 'Projects spanning cultural heritage, research and technology: a complex picture to translate into a clear narrative.'
  - file: ../../../assets/images/projects/aedo/aedo-01-identita.jpg
    alt:
      it: 'Il vecchio logo Aedo, la palette e il lettering del nuovo marchio, il feed Instagram su smartphone e biglietti da visita.'
      en: 'The old Aedo logo, the new brand''s palette and lettering, the Instagram feed on smartphones and business cards.'
    caption:
      it: Dopo anni, Aedo acquisisce un'identità visiva coerente con i propri obiettivi e valori, applicata alla strategia di comunicazione online e offline.
      en: After several years, Aedo adopts a visual identity aligned with its objectives and values, applied across its online and offline communication strategy.
  - file: ../../../assets/images/projects/aedo/aedo-03-sito.jpg
    alt:
      it: 'Homepage del sito Aedo su un portatile, con i progetti Smart Schooling, Il Gioco della Guerra e AscoltaMI.'
      en: 'Aedo website homepage on a laptop, showing the projects Smart Schooling, Il Gioco della Guerra and AscoltaMI.'
    caption:
      it: "Il nuovo sito: architettura, narrazione e recupero dell'archivio fotografico per trasmettere il valore dei progetti di Aedo e il loro impatto."
      en: "The new website: structure, storytelling and the recovery of the photographic archive to communicate the value and impact of Aedo's projects."
  - file: ../../../assets/images/projects/aedo/aedo-04-presentazioni.jpg
    alt:
      it: 'Presentazione "per Agenda 2030" su un tablet e pagina di un report OFFLab con il grafico delle attività su un portatile.'
      en: '"per Agenda 2030" presentation on a tablet and an OFFLab report page with an activity chart on a laptop.'
    caption:
      it: Un codice grafico istituzionale pulito ma riconoscibile, applicato a presentazioni di progetto e report di attività.
      en: A clean yet recognisable institutional graphic system, applied to project presentations and activity reports.
  - file: ../../../assets/images/projects/aedo/aedo-05-social.jpg
    alt:
      it: 'Tre smartphone con un post, un video e una storia Instagram di Aedo.'
      en: 'Three smartphones showing an Aedo Instagram post, video and story.'
    caption:
      it: 'Strategia e contenuti social: progetti, territori e persone raccontati con un linguaggio coerente.'
      en: 'Social strategy and content: projects, places and people told through a consistent language.'
  - file: ../../../assets/images/projects/aedo/aedo-06-relazione.jpg
    alt:
      it: 'Copertina stampata della relazione sui podcast per Palazzo Moroni e Castello e Parco di Masino.'
      en: 'Printed cover of the report on the podcasts for Palazzo Moroni and Castello e Parco di Masino.'
    caption:
      it: Anche i documenti ufficiali, come preventivi, relazioni e presentazioni di progetti e attività, seguono l'identità visiva e la coerenza del brand Aedo.
      en: Official documents, including quotations, reports and project and activity presentations, also follow Aedo's visual identity and brand consistency.
