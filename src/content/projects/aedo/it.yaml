title: Aedo Sperimentare Culture
role: Communication and Project Assistant
results: 'La realizzazione e la messa online del nuovo sito web e la ripresa della comunicazione sui social network.'
description: 'Aedo è un''impresa culturale attiva da circa dieci anni sul territorio lombardo, impegnata nello sviluppo di progetti culturali, educativi e digitali. Ha una vocazione sociale ma allo stesso tempo artistica. In seguito alla definizione della propria identità istituzionale, Aedo ha avviato un processo di rinnovamento della comunicazione, applicando il nuovo sistema visivo e narrativo ai diversi canali e materiali aziendali: sito web, social network, presentazioni istituzionali e strumenti di comunicazione cartacei.'
activities:
- 'Ero responsabile dell''implementazione del nuovo codice visivo e della nuova identità visiva dell''impresa culturale. Questo ha significato innanzitutto occuparmi delle presentazioni istituzionali e di quelle rivolte agli stakeholder. Mi sono poi occupata del recupero dei materiali d''archivio per la realizzazione del nuovo sito web, del social media management e dello sviluppo delle strategie di contenuto per i canali social.'
