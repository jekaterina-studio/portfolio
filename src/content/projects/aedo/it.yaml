description: 'Aedo è un''impresa culturale attiva da circa dieci anni sul territorio lombardo, impegnata nello sviluppo di progetti culturali, educativi e digitali. In seguito alla definizione della propria identità istituzionale, Aedo ha avviato un processo di rinnovamento della comunicazione, applicando il nuovo sistema visivo e narrativo ai diversi canali e materiali aziendali: sito web, social network, presentazioni istituzionali e strumenti di comunicazione cartacei.'
