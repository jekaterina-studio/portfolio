title: Oltre lo sguardo
description: |-
  Oltre lo sguardo è un progetto sviluppato da Aedo Sperimentare Culture insieme al Museo Poldi Pezzoli, dedicato all'accessibilità del patrimonio artistico per persone non vedenti e ipovedenti. Avviato in occasione della mostra Piero della Francesca. Il Polittico agostiniano riunito, il progetto ha sperimentato modalità inclusive di fruizione delle opere attraverso tavole visivo-tattili, testi ad alta leggibilità, trascrizioni in braille e audiodescrizioni in italiano e inglese.
role: Communication and Project Assistant
links:
- label: 'oltre lo sguardo - museo poldi pezzoli'
  url: https://museopoldipezzoli.it/visita/accessibilita/oltre-lo-sguardo/
sections:
- label: contributo
  text: Ho affiancato il team di Aedo durante la prima edizione del progetto, supportando l'organizzazione delle attività di mediazione culturale insieme a Stefania Rossi, referente dei progetti culturali del Museo, e al Gruppo Giovani Museo Poldi Pezzoli. Mi sono inoltre occupata del supporto alla comunicazione istituzionale e della documentazione delle attività.
