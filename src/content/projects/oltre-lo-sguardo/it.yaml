title: Oltre lo sguardo
description: |-
  Il Museo Poldi Pezzoli continua il suo impegno per rendere l'arte accessibile a tutti, proponendo itinerari speciali per visitatori non vedenti e ipovedenti. La proposta ha preso il via in occasione della mostra "Piero della Francesca. Il Polittico agostiniano riunito".

  Il percorso di visita include tavole visivo-tattili realizzate da Tactile Vision Onlus, con immagini a colori in alta definizione dell'opera selezionata, stampa grafica in rilievo per la lettura tattile, testi ad alta leggibilità, trascrizioni in braille e QR code per le audiodescrizioni in italiano e in inglese. Il progetto si propone di comunicare l'opera d'arte in modo semplice e inclusivo, rivolgendosi a un pubblico il più ampio possibile, per età e abilità, con una particolare attenzione alle persone con difficoltà sensoriali.
role: Assistenza alla mediazione culturale con il gruppo Giovani del Poldi Pezzoli
