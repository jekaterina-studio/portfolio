title: Oltre lo sguardo
description: |-
  The Museo Poldi Pezzoli continues its commitment to making art accessible to everyone, offering special tours for blind and partially sighted visitors. The programme was launched on the occasion of the exhibition "Piero della Francesca. Il Polittico agostiniano riunito".

  The tour includes visual-tactile panels created by Tactile Vision Onlus, featuring high-definition colour images of the selected work, raised graphic printing for tactile reading, highly legible texts, braille transcriptions and QR codes for audio descriptions in Italian and English. The project aims to communicate the artwork in a simple and inclusive way, reaching the widest possible audience across ages and abilities, with particular attention to people with sensory impairments.
role: Cultural mediation assistant with the Giovani del Poldi Pezzoli group and documentation of the activities
