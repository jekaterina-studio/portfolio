# Approved British English copy (portfolio_website_copy_british_english.pdf)
title: Askoll XKP 80
description: Organisation of the local launch event and test ride experience for the Askoll XKP 80 at the official Askoll store in Milan.
activities:
- contribution to the event concept and format
- permit management and supplier coordination
- event set-up and operational preparation
- coordination of DJ and catering services
- invitations, RSVP management and guest coordination
- coordination of photo and video documentation
- collaboration with Askoll on the press conference, M4 campaign, lead generation, influencer engagement and invitations to selected customers
- budget and expense management, followed by reporting
results:
  items:
  - approximately 80 attendees
  - 20 test rides
  - 1 vehicle sold during the event
