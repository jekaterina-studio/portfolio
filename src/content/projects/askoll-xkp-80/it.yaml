# Approved Italian copy (portfolio_testi_italiano.pdf)
title: Askoll XKP 80
description: Organizzazione dell'evento di lancio locale e dell'esperienza di test ride per Askoll XKP 80 presso il punto vendita ufficiale Askoll di Milano.
activities:
- contributo al concept e al format
- gestione dei permessi e coordinamento dei fornitori
- allestimento e preparazione operativa
- coordinamento DJ e catering
- inviti, RSVP e coordinamento ospiti
- coordinamento della documentazione foto e video
- collaborazione con Askoll su conferenza stampa, campagna M4, lead generation, influencer e inviti a clienti selezionati
- gestione budget, spese e report post-evento
results:
  items:
  - circa 80 partecipanti
  - 20 test ride
  - 1 veicolo venduto durante l'evento
