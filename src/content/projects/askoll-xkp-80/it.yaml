title: Askoll XKP 80, lancio locale del prodotto
description: 'Il 6 giugno 2024, GPone Milano ha organizzato presso l''Askoll Store di Milano Darsena un evento dedicato alla presentazione e alla prova in anteprima del nuovo modello di e-scooter Askoll: XKP 80. L''iniziativa ha unito la presentazione del prodotto a un''esperienza aperta al pubblico, con test ride, dimostrazioni tecniche e un momento conviviale, per avvicinare le persone alla mobilità urbana sostenibile.'
activities:
- contributo al concept e al format
- gestione dei permessi e coordinamento dei fornitori
- allestimento e preparazione operativa
- coordinamento DJ e catering
- inviti, RSVP e coordinamento ospiti
- coordinamento della documentazione foto e video
- collaborazione con Askoll su conferenza stampa, campagna M4, lead generation, influencer e inviti a clienti selezionati
- gestione budget, spese e report post-evento
role: Project Lead
results:
  items:
  - circa 80 partecipanti
  - 20 test ride
  - 1 veicolo venduto durante l'evento
