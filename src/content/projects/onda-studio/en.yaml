- 'definition of editorial plans, content and tone of voice for the different channels'
- 'updating and managing the social media channels and developing content independently or by coordinating support staff'
- 'research, recovery and reorganisation of materials from the historical archive'
- 'reorganisation, cleaning and segmentation of the contact databases'
- 'management of the database migration to a new newsletter platform'
