description: 'Onda Studio is a creative new media art studio based in Monza with an international outlook, working in digital arts and multimedia projects. Alongside the studio''s activities, its history and identity are intertwined with those of Kernel Festival and AreaOdeon, a non-profit cultural organisation active in the Monza area for over twenty years. The range of organisations and activities involved called for more structured digital communication, able to use different channels, formats and languages while maintaining editorial and identity consistency.'
activities:
