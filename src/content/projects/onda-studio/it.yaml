title: Comunicazione Onda Studio
role: Communication, Partnerships and Business Development Coordinator
description: 'Onda Studio è un new media art studio creativo con sede a Monza e una dimensione internazionale, attivo nell''ambito delle arti digitali e dei progetti multimediali. Accanto alle attività dello studio, la sua storia e identità si intrecciano con quelle di Kernel Festival e AreaOdeon, organizzazione culturale non profit attiva sul territorio monzese da oltre vent''anni. La pluralità delle realtà coinvolte e delle rispettive attività richiedeva una comunicazione digitale più strutturata, capace di adottare canali, formati e linguaggi differenti, mantenendo coerenza editoriale e identitaria.'
activities:
- ricerca e sviluppo di opportunità internazionali
- sviluppo, scrittura e coordinamento di candidature progettuali
- preparazione di proposte e materiali di presentazione
- sviluppo commerciale e ricerca di partnership
- sviluppo di relazioni con potenziali partner e committenti
- gestione e coordinamento delle newsletter
- riordino e riorganizzazione del database contatti
- supporto alla comunicazione e alle attività operative di progetto
