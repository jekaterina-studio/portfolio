# Approved Italian copy (portfolio_testi_italiano.pdf)
sector: new media art studio
keywords:
- multichannel social media strategy
- database restructuring and migration
title: Comunicazione Onda Studio
role: Communication, Partnerships and Business Development Coordinator
description: 'Onda Studio è un new media art studio creativo con sede a Monza e una dimensione internazionale, attivo nell''ambito delle arti digitali e dei progetti multimediali. Accanto alle attività dello studio, la sua storia e identità si intrecciano con quelle di Kernel Festival e AreaOdeon, organizzazione culturale non profit attiva sul territorio monzese da oltre vent''anni. La pluralità delle realtà coinvolte e delle rispettive attività richiedeva una comunicazione digitale più strutturata, capace di adottare canali, formati e linguaggi differenti, mantenendo coerenza editoriale e identitaria.'
activities:
- 'sviluppo della strategia di comunicazione digitale ed editoriale per le tre realtà'
- 'definizione dei piani editoriali, dei contenuti e dei tone of voice per i diversi canali'
- 'aggiornamento e gestione dei canali social e sviluppo di contenuti in autonomia o coordinando risorse di supporto'
- 'ricerca, recupero e riorganizzazione di materiali dall''archivio storico'
- 'riorganizzazione, pulizia e segmentazione dei database di contatti'
- 'gestione della migrazione dei database verso una nuova piattaforma di newslettering'
results:
  items:
  - 'sviluppo di una comunicazione social coordinata per le tre realtà, attraverso piani editoriali, contenuti e linguaggi differenziati'
  - 'riorganizzazione e pulizia dei database storici delle tre realtà, con segmentazione dei contatti e migrazione alla nuova piattaforma di newslettering'
