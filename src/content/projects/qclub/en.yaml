title: QClub
role: Live Lighting Operator and Venue Operations Support
description: I work on lighting operations during live events and performances, following technical sheets and artists' cues. The role also involves coordination with organisers, art directors and performers, as well as occasional support for the venue's operational activities. Alongside the technical work, I contribute to scouting and onboarding new team members and, when needed, support the team with day-to-day venue activities.
activities:
- lighting operation during live events and performances
- following technical sheets and artists' cues
- coordination with organisers, art directors and performers
- operational support for venue activities
- occasional support with photo shoots, cash desk and cloakroom
- scouting and onboarding new team members
