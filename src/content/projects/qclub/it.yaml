# Approved Italian copy (portfolio_testi_italiano.pdf)
title: QClub live events
role: Live Lighting Operator and Venue Operations Support
description: Lavoro nella gestione delle luci durante eventi e performance dal vivo, seguendo le schede tecniche e i cue degli artisti. Il ruolo comprende anche il coordinamento con organizzatori, art director e performer e un supporto occasionale alle attività operative della venue. Accanto alla gestione tecnica, collaboro allo scouting e all'inserimento di nuove risorse e, quando necessario, affianco il team nelle attività quotidiane del locale.
activities:
- gestione delle luci durante eventi e performance
- lettura e applicazione di schede tecniche e cue
- coordinamento con organizzatori, art director e performer
- supporto operativo alla venue
- supporto occasionale a shooting, cassa e guardaroba
- scouting e inserimento di nuove risorse
