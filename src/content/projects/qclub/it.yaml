title: Live Events at QClub
description: |-
  QClub è uno storico club della scena underground queer e techno milanese, uno spazio dedicato alla musica elettronica, alla sperimentazione artistica e alle espressioni della cultura clubbing indipendente.

  La mia collaborazione, avviata nel maggio 2026, si concentra sulla gestione dell'illuminazione durante eventi, DJ set e performance dal vivo. Lavoro seguendo le schede tecniche e i cue degli artisti, interpretando le esigenze visive e adattando le luci all'andamento delle performance. Accanto alla componente tecnica, collaboro con organizzatori, art director e performer e partecipo, quando necessario, alle attività operative e allo sviluppo del team del locale.
activities:
- gestione delle luci durante eventi, DJ set e performance dal vivo
- lettura e applicazione di schede tecniche e cue degli artisti
- coordinamento con organizzatori, art director e performer
- supporto operativo alle attività della venue
- supporto occasionale a shooting, cassa e guardaroba
- scouting di supporto e inserimento di nuove risorse
role: Live Lighting Coordinator
