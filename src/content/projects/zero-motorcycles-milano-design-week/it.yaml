title: GPone Milano per Zero Motorcycles MDW24
description: 'In occasione della Milano Design Week 2024, GPone Milano, concessionario ufficiale di Zero Motorcycles, ha collaborato con il brand alla realizzazione di un evento dedicato alla mobilità elettrica. L''iniziativa ha presentato al pubblico la gamma di motociclette elettriche del brand presso BarconeMilano, sul Naviglio Grande, offrendo la possibilità di partecipare a test ride presso la sede GPone Milano Darsena e di scoprire da vicino la mobilità a zero emissioni. I momenti di test ride, fruibili nel periodo del Fuorisalone, erano accompagnati dal rinfresco e dalla consegna di gadget brandizzati.'
activities:
- 'presenza e supporto operativo durante l''evento'
- 'gestione della comunicazione e promozione attraverso post social, campagne sponsorizzate, form di iscrizione e banner sul sito'
- 'coordinamento della realizzazione dei materiali di promozione offline (gift card)'
- 'accoglienza e brief degli influencer in sede'
role: Project Coordinator
results:
  items:
  - 3 event day
  - 23 test ride
  - 5 lead
