title: GPone Milano per Zero Motorcycles MDW24
description: 'In occasione della Milano Design Week 2024, GPone Milano, concessionario ufficiale di Zero Motorcycles, ha collaborato con il brand alla realizzazione di un evento dedicato alla mobilità elettrica. L''iniziativa ha presentato al pubblico la gamma di motociclette elettriche del brand presso BarconeMilano, sul Naviglio Grande, offrendo la possibilità di partecipare a test ride presso la sede GPone Milano Darsena e di scoprire da vicino la mobilità a zero emissioni. L''evento si è svolto il 19 aprile, con un momento di rinfresco e gadget dedicati ai partecipanti.'
activities:
- 'coordinamento dell''attività di test ride in store'
- 'supporto alla gestione della logistica'
- 'presenza e supporto operativo durante l''evento'
- 'gestione della comunicazione e promozione attraverso post social, campagne sponsorizzate, form di iscrizione e banner sul sito'
- 'accoglienza e brief degli influencer in sede'
