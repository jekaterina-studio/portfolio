description: 'For Milan Design Week 2024, GPone Milano, the official Zero Motorcycles dealership, partnered with the brand on an event dedicated to electric mobility. The initiative introduced the brand''s range of electric motorcycles to the public at BarconeMilano, on the Naviglio Grande, offering test rides at the GPone Milano Darsena premises and a close-up look at zero-emission mobility. The test ride sessions, available throughout the Fuorisalone period, were accompanied by refreshments and branded gadgets.'
