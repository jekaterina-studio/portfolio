title: GPone Milano for Zero Motorcycles MDW23
description: 'For Milan Design Week 2024, GPone Milano partnered with Zero Motorcycles on an event at BarconeMilano, on the Naviglio Grande. The initiative introduced the brand''s range of electric motorcycles to the public, offering test rides at the brand''s official dealership, GPone Milano Darsena, and a close-up look at zero-emission mobility. The event took place on 19 April, with refreshments and dedicated gadgets for participants.'
