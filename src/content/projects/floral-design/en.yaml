# Approved British English copy (portfolio_website_copy_british_english.pdf)
title: floral design
description: |-
  Studying floral design has introduced me to a new approach to technical processes and materials. It has also allowed me to reconnect with a sense of craftsmanship and a tactile relationship with the world around me, something I have always had but needed to rediscover over the years.

  Through botanical compositions, I find a way to express personal, intimate, meaningful and symbolic concepts.

  I am interested in the dialogue between natural and artificial materials: botanical elements brought together with glass, ceramics, resins, metals and textiles. These encounters lead to material explorations that give rise to compositions and aesthetic textures for those who, like me, are looking for a distinctive mark.
sections:
