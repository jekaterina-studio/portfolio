# Approved Italian copy (portfolio_testi_italiano.pdf)
title: floral design
description: |-
  Lo studio del floral design mi ha aperto a un approccio inedito ai processi tecnici e ai materiali, permettendomi di recuperare una manualità e un legame tattile con l'esterno che ho sempre avuto, ma che negli anni ho dovuto ricercare.

  Attraverso le composizioni botaniche trovo una forma per esprimere concetti personali, intimi, significativi e simbolici.

  Mi interessa il dialogo tra materiali naturali e artificiali: elementi vegetali accostati ad altri materiali come vetro, ceramica, resine, metalli e tessuti. Da questi incontri nascono sperimentazioni materiche che danno vita a composizioni e texture estetiche destinate a chi, come me, cerca un segno.
sections:
