media:
- layout: series
  format: portrait
  images:
  - file: ../../../assets/images/projects/gpone-milano/gpone-02-cluster.jpg
    alt:
      it: 'Schema dei tre cluster comunicativi di GPone Milano: motoveicoli tradizionali, servizi di officina, e-mobility.'
      en: 'Diagram of GPone Milano''s three communication clusters: traditional motorcycles, workshop services, e-mobility.'
    caption:
      it: 'Tre cluster, un solo marchio: vendita, officina ed e-mobility richiedevano linguaggi e obiettivi distinti.'
      en: 'Three clusters, one brand: sales, servicing and e-mobility required distinct languages and objectives.'
  - file: ../../../assets/images/projects/gpone-milano/gpone-01-rebranding.jpg
    alt:
      it: 'Tre versioni del logo GPone Milano, dal marchio storico al refresh, un laccetto con il nuovo logo e il sito su un portatile.'
      en: 'Three versions of the GPone Milano logo, from the original mark to the refresh, a lanyard with the new logo and the website on a laptop.'
    caption:
      it: GPone Milano investe nel rinnovamento del proprio logo e avvia una nuova fase della comunicazione, online e offline.
      en: GPone Milano invests in a new logo and begins a new phase of communication, both online and offline.
  - file: ../../../assets/images/projects/gpone-milano/gpone-09-feed-instagram.jpg
    alt:
      it: 'Smartphone con il feed Instagram di GPone Milano: foto di moto e grafiche nere e verdi con titoli.'
      en: 'Smartphone showing the GPone Milano Instagram feed: motorcycle photos and black and green graphics with headlines.'
    caption:
      it: Anche i social assumono una nuova direzione visiva e narrativa, in linea con il percorso di rinnovamento del brand.
      en: Social channels also take on a new visual and narrative direction, in line with the brand's renewal.
  - file: ../../../assets/images/projects/gpone-milano/gpone-10-product-service-stories.jpg
    alt:
      it: 'Griglia di contenuti GPone Milano divisi in tre righe: product, service e stories.'
      en: 'Grid of GPone Milano content in three rows: product, service and stories.'
    caption:
      it: 'I contenuti seguono tematiche specifiche: prodotto, servizio e persone, ma anche promozioni, offerte e occasioni legate al retail.'
      en: 'Content is organised around specific themes: products, services and people, as well as promotions, offers and retail opportunities.'
  - file: ../../../assets/images/projects/gpone-milano/gpone-11-tiktok.jpg
    alt:
      it: 'Tre smartphone con video TikTok di GPone Milano girati in officina e nello store.'
      en: 'Three smartphones showing GPone Milano TikTok videos filmed in the workshop and the store.'
    caption:
      it: Produzione interna dei contenuti social, dall'ideazione alle riprese e al montaggio. I video seguivano format, script e logiche narrative progettati insieme alle figure commerciali e di assistenza, con il contributo di esperti di moto tradizionali ed e-mobility.
      en: In-house social content production, from concept development to filming and editing. Videos followed formats, scripts and narrative approaches developed with the sales and servicing teams, with input from experts in traditional motorcycles and e-mobility.
  - file: ../../../assets/images/projects/gpone-milano/gpone-04-foto-campagna.jpg
    alt:
      it: 'Persona su uno scooter Askoll, due annunci social realizzati con le stesse foto e i grafici delle visite al sito.'
      en: 'Person on an Askoll scooter, two social ads made with the same photos and charts of website visits.'
    caption:
      it: Le immagini acquisite e i contenuti prodotti internamente diventavano materiali per campagne sponsorizzate e iniziative specifiche, come quelle realizzate durante la Fashion Week. Le attività venivano monitorate attraverso l'analisi delle metriche.
      en: Images and in-house content became assets for sponsored campaigns and specific initiatives, such as those developed during Fashion Week. Activities were monitored through performance analysis.
  - file: ../../../assets/images/projects/gpone-milano/gpone-03-report.jpg
    alt:
      it: 'Copertine e una pagina dei report social di GPone Milano, con dati di engagement e visite.'
      en: 'Covers and a page of GPone Milano''s social media reports, with engagement and visit data.'
    caption:
      it: Report trimestrali, semestrali e annuali per monitorare le performance e orientare le strategie successive.
      en: Quarterly, half-yearly and annual reports to monitor performance and inform subsequent strategies.
  - file: ../../../assets/images/projects/gpone-milano/gpone-07-prodotto.jpg
    alt:
      it: 'Moto elettrica verde fotografata all''aperto in un contesto urbano.'
      en: 'Green electric motorcycle photographed outdoors in an urban setting.'
    caption:
      it: "Uno scatto che racchiude un'atmosfera più essenziale e misteriosa, pensata per esprimere il carattere di un modello elettrico di alta gamma: Zero Motorcycles."
      en: 'An image capturing a more pared-back and mysterious atmosphere, designed to express the character of a high-end electric model: Zero Motorcycles.'
  - file: ../../../assets/images/projects/gpone-milano/gpone-05-store.jpg
    alt:
      it: 'Moto esposta nello store davanti a una carta da parati tropicale e biglietti da visita GPone Milano.'
      en: 'Motorcycle on display in the store against tropical wallpaper, and GPone Milano business cards.'
    caption:
      it: Lo store come spazio di comunicazione, attraverso la cura dell'esposizione e dei materiali dedicati.
      en: The store as a communication space, through considered displays and dedicated materials.
  - file: ../../../assets/images/projects/gpone-milano/gpone-08-persone.jpg
    alt:
      it: 'Tre persone che chiacchierano durante un evento sotto un arco con la scritta "E taggaci su Instagram @gpone_milano".'
      en: 'Three people chatting at an event under an arch reading "E taggaci su Instagram @gpone_milano".'
    caption:
      it: Gli eventi come occasioni di incontro e relazione tra team, partner e clienti, contribuendo alla costruzione della reputazione del brand.
      en: Events as opportunities for teams, partners and customers to meet and connect, helping build the brand's reputation.
