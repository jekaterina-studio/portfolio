    alt:
      it: 'Schema dei tre cluster comunicativi di GPone Milano: motoveicoli tradizionali, servizi di officina, e-mobility.'
      en: 'Diagram of GPone Milano''s three communication clusters: traditional motorcycles, workshop services, e-mobility.'
