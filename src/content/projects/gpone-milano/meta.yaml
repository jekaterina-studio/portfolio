  - file: ../../../assets/images/projects/gpone-milano/gpone-05-store.jpg
    alt:
      it: 'Moto esposta nello store davanti a una carta da parati tropicale e biglietti da visita GPone Milano.'
      en: 'Motorcycle on display in the store against tropical wallpaper, and GPone Milano business cards.'
