title: GPone Milano
role: Social Media Manager (aprile 2023 - novembre 2024); Marketing Lead (dicembre 2024 - ottobre 2025)
description: 'Un''esperienza che si è sviluppata progressivamente, dalla gestione dei canali social alla responsabilità delle attività di marketing e comunicazione. Mi sono occupata della pianificazione editoriale, della produzione dei contenuti, delle campagne promozionali, delle collaborazioni commerciali e del coordinamento di iniziative ed eventi. Una parte importante del lavoro è stata la produzione interna: ideazione dei contenuti, riprese, interviste, scrittura, montaggio e pubblicazione. Ho inoltre seguito l''applicazione della nuova identità visiva sui materiali di comunicazione, in collaborazione con il grafico.'
activities:
- strategia di marketing e comunicazione
- gestione dei canali social
- pianificazione editoriale
- produzione di contenuti fotografici e video
- campagne pubblicitarie e promozionali per i social
- collaborazioni commerciali
- applicazione della nuova identità visiva
- organizzazione e coordinamento di eventi
