title: AscoltaMi
description: |-
  AscoltaMi is a cultural and educational project offering an audio route through Milan's House Museums, aimed at new residents and non-native Italian speakers with A2/B1 language skills. The project is based on the Global Approach, a language-teaching method that fosters the development of linguistic and communicative skills through a creative, multisensory and immersive learning experience. The museum becomes a place that invites you to become part of it, while the city becomes a way to discover the everyday, yet never superficial, use of the language and culture.
results: Following its second edition, the project evolved into a cultural format.
