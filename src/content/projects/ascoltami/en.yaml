sector: cultural podcast, educational format
keywords:
- cultural mediation
title: AscoltaMi
description: |-
  AscoltaMi is a cultural and educational project offering an audio route through Milan's House Museums, aimed at new residents and non-native Italian speakers with A2/B1 language skills. The project is based on the Global Approach, a language-teaching method that fosters the development of linguistic and communicative skills through a creative, multisensory and immersive learning experience. The museum becomes a place that invites you to become part of it, while the city becomes a way to discover the everyday, yet never superficial, use of the language and culture.
activities:
- 'support for the development of the project and its teaching method, in collaboration with the educational and museum staff involved'
- 'editing and adaptation of the audio texts to make them easier to understand linguistically'
- 'participation in the audio production as a voice-over speaker, plus graphic development and layout of the educational toolkit'
- 'support for Edition 0 with the students, mediation during the route and collection of feedback and documentation'
role: Communication and Project Assistant
