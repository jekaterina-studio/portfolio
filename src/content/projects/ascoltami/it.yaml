title: AscoltaMi
description: |-
  AscoltaMi è un progetto culturale ed educativo che propone un percorso audio attraverso le Case Museo di Milano, rivolto a nuovi cittadini e persone non madrelingua italiana con competenze linguistiche di livello A2/B1. Il progetto si basa sull'Approccio Globale, un metodo glottodidattico che favorisce lo sviluppo delle competenze linguistico-comunicative attraverso un'esperienza di apprendimento creativa, multisensoriale e immersiva. Il museo diventa un luogo che chiede di diventarne parte, mentre la città diventa un modo per conoscere l'uso quotidiano, ma non superficiale, della lingua e della cultura.
results: Dopo la seconda edizione, il progetto si è evoluto in un format culturale.
