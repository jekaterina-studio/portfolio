  - file: ../../../assets/images/projects/ascoltami/ascoltami-01.jpg
    alt:
      it: 'Un ragazzo e una ragazza davanti a una vetrina di orologi antichi; sotto, il gruppo sui gradini davanti al Duomo di Milano.'
      en: 'A young man and woman in front of a display case of antique watches; below, the group on the steps in front of Milan Cathedral.'
    caption:
      it: AscoltaMi nasce per avvicinare nuovi cittadini al patrimonio culturale, rendendo il museo uno spazio di incontro, apprendimento e partecipazione.
      en: AscoltaMi was created to bring new residents closer to cultural heritage, making the museum a place for encounter, learning and participation.
  - file: ../../../assets/images/projects/ascoltami/ascoltami-02.jpg
    alt:
      it: 'Ragazze con smartphone e una cassa portatile durante l''ascolto all''aperto.'
      en: 'Young women with smartphones and a portable speaker, listening outdoors.'
    caption:
      it: "Edizione 0: l'ascolto delle tracce audio in gruppo, con smartphone e cassa portatile."
      en: 'Edition 0: listening to the audio tracks as a group, using a smartphone and a portable speaker.'
  - file: ../../../assets/images/projects/ascoltami/ascoltami-03.jpg
    alt:
      it: 'Un libro aperto con la pianta di una casa museo; sotto, ragazze e ragazzi sorridenti in un cortile.'
      en: 'An open book showing the floor plan of a house museum; below, smiling young people in a courtyard.'
    caption:
      it: 'Piante, testi e momenti di confronto: il museo diventa un luogo di cui fare parte.'
      en: 'Plants, texts and moments of discussion: the museum becomes a place to feel part of.'
  - file: ../../../assets/images/projects/ascoltami/ascoltami-05.jpg
    alt:
      it: 'Ragazze in ascolto davanti a un dipinto antico in una sala della casa museo.'
      en: 'Young women listening in front of an old painting in a room of the house museum.'
    caption:
      it: 'Il percorso nelle Case Museo: osservare le opere, ascoltare le storie e familiarizzare con il linguaggio del museo.'
      en: 'The journey through the House Museums: looking at the artworks, listening to their stories and becoming familiar with the language of the museum.'
  - file: ../../../assets/images/projects/ascoltami/ascoltami-06.jpg
    alt:
      it: 'Un uomo in ascolto tra i partecipanti, in una sala in penombra.'
      en: 'A man listening among the participants in a dimly lit room.'
    caption:
      it: Durante la visita al Museo Poldi Pezzoli, l'ascolto diventa occasione di confronto e apprendimento condiviso.
      en: During the visit to the Museo Poldi Pezzoli, listening becomes an opportunity for shared discussion and learning.
  - file: ../../../assets/images/projects/ascoltami/ascoltami-07.jpg
    alt:
      it: 'Un gruppo di ragazze cammina davanti a un ristorante, con insegne e menu in più lingue.'
      en: 'A group of young women walking past a restaurant with signs and menus in several languages.'
    caption:
      it: "La città come aula: l'uso quotidiano della lingua, tra insegne e menu."
      en: 'The city as a classroom: using language in everyday situations, from shop signs to menus.'
  - file: ../../../assets/images/projects/ascoltami/ascoltami-08.jpg
    alt:
      it: 'Un ragazzo di profilo davanti a un ritratto di San Pietro in cornice dorata.'
      en: 'A young man in profile facing a portrait of Saint Peter in a gilded frame.'
    caption:
      it: Ascoltare, osservare e riconoscere nuove parole attraverso l'incontro diretto con le opere.
      en: Listening, observing and recognising new words through direct encounters with artworks.
  - file: ../../../assets/images/projects/ascoltami/ascoltami-04.jpg
