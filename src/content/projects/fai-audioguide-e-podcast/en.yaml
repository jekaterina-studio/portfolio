title: FAI narratives
description: 'FAI Narrazioni Italiane is a cultural and sound production project created by Aedo Sperimentare Culture in collaboration with FAI - Fondo per l''Ambiente Italiano and Audible. Through audio storytelling, historical research and soundscapes, the project aims to enhance the historical, artistic and landscape heritage of FAI''s remarkable sites, offering new ways of discovering and experiencing them for Italian and international audiences.'
descriptionNote: 'My collaboration covered four productions at four FAI sites: **Parco di Villa Gregoriana** in Tivoli, **Casa Noha** in Matera, **Castello e Parco di Masino** in Caravino, **Palazzo Moroni** in Bergamo.'
activities:
- 'support for documentary research and the gathering of historical and cultural information about the sites'
- 'support for music research and the selection of sound references'
- 'assistance across the different production stages of the audio narratives'
- 'support for content development and the realisation of the productions'
role: Communication and Project Assistant
