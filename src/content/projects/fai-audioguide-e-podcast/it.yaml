# Approved Italian copy (portfolio_testi_italiano.pdf)
sector: podcast e audioguide culturali
keywords:
- cultural research
- narrative development
title: FAI narrazioni
description: 'FAI Narrazioni Italiane è un progetto di produzione culturale e sonora realizzato da Aedo Sperimentare Culture in collaborazione con il FAI - Fondo per l''Ambiente Italiano e Audible. Attraverso narrazioni audio, ricerca storica e paesaggi sonori, il progetto mira a valorizzare il patrimonio storico, artistico e paesaggistico dei preziosi luoghi FAI, offrendo nuove modalità di scoperta e fruizione rivolte alle audience italiane ed internazionali.'
descriptionNote: 'La mia collaborazione ha riguardato quattro produzioni in quattro beni FAI: **Parco di Villa Gregoriana** a Tivoli, **Casa Noha** a Matera, **Castello e Parco di Masino** a Caravino, **Palazzo Moroni** a Bergamo.'
sections:
- label: Villa Gregoriana
  text: ricerca e sviluppo dei contenuti, adattamento dei testi e revisione dei suoni ambientali con il sound engineer; 13 episodi, 4 lingue, 68 tracce audio, 11 tappe e 2 approfondimenti.
- label: Castello e Parco di Masino
  text: consultazione del database contatti, contributo alle domande per le interviste e raccolta di testimonianze in loco.
- label: Casa Noha
  text: 'contributo alla ricerca storica e contestuale per la versione in lingua spagnola del documentario audiovisivo “I Sassi invisibili: Viaggio straordinario nella storia di Matera”; 3 sale, 6 capitoli e circa 30 minuti di contenuti.'
