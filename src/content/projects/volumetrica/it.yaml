title: VOLUMETRICA
description: |-
  VOLUMETRICA è un'installazione immersiva di luce laser e suono sviluppata da Onda Studio, che esplora la relazione tra luce, spazio, riflesso e percezione. Attraverso fasci laser e un sistema di specchi calibrati, l'opera genera composizioni geometriche tridimensionali, trasformando lo spazio in un'architettura di linee e volumi.

  Ispirata alla ricerca di Wassily Kandinsky e alla relazione tra punto, linea e superficie, integra una composizione sonora multicanale. La configurazione standard misura 19,5 × 4,1 × 4,1 metri, con una struttura modulare e scalabile che permette di adattare l'installazione a differenti spazi e contesti espositivi, prevalentemente indoor.
