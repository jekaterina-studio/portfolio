title: VOLUMETRICA
description: |-
  VOLUMETRICA is an immersive laser light and sound installation developed by Onda Studio, exploring the relationship between light, space, reflection and perception. Through laser beams and a system of calibrated mirrors, the work generates three-dimensional geometric compositions, transforming space into an architecture of lines and volumes.

  Inspired by Wassily Kandinsky's research and the relationship between point, line and plane, it integrates a multichannel sound composition. The standard configuration measures 19.5 × 4.1 × 4.1 metres, with a modular and scalable structure that allows the installation to be adapted to different spaces and exhibition contexts, mainly indoors.
