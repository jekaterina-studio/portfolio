title: photography and art direction
description: |-
  Photography is a language that has accompanied me since my earliest explorations of the world, through my travels, encounters and relationships. The points of interest may change, but the medium remains the same: a tool for collecting details, vulnerabilities and moments of stillness.

  I am interested in giving shape to what remains hidden.
