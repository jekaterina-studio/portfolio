# Approved Italian copy (portfolio_testi_italiano.pdf)
title: photography and art direction
description: |-
  La fotografia è un linguaggio che mi accompagna fin dai primi momenti di esplorazione del mondo, nei miei viaggi, rapporti, relazioni. Cambiano i punti di interesse, ma non il mezzo: uno strumento per raccogliere dettagli, vulnerabilità e momenti di arresto.

  Mi interessa dare forma a ciò che si nasconde.
