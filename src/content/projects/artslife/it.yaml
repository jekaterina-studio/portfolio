description: |-
  ArtsLife è una storica rivista e realtà editoriale italiana specializzata nel mercato dell'arte, punto di riferimento per il settore dell'art advisory.

  La collaborazione, della durata di quattro mesi, si è articolata in due fasi. La prima ha riguardato la comunicazione della mostra Strangers dell'artista Andrej Esionov, presentata a Venezia. Successivamente, mi è stato proposto di sviluppare una nuova direzione strategica per la presenza digitale di ArtsLife.
