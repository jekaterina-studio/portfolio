title: cantautorato
description: |-
  Scrittura: un fedele modo di sentire ed abitare la vita, che mi accompagna nei stati d'animo, nei periodi di transizione e nell'ordinaria quotidianità delle giornate.

  Le parole diventano canzoni quando trovano una forma accompagnati agli accordi della chitarra acustica.

  Si trasformano in un brano quando vengono condivise con persone che si ritrovano nella poetica e desiderano farne parte in maniera spontanea.
