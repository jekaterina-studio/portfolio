title: songwriting
description: |-
  Writing: a faithful way of feeling and inhabiting life, accompanying me through different states of mind, periods of transition and the ordinary rhythm of everyday life.

  Words become songs when they find their form alongside the chords of an acoustic guitar.

  They become a piece of music when shared with people who connect with its poetic language and choose to take part in it spontaneously.
