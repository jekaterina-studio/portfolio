  intro:
    it: Una parte del mio lavoro nasce da ciò che osservo, vivo e sento e dal bisogno impellente di trovare una forma per esprimerlo all'esterno. Prevalentemente, sono tre le forme che oggi scelgo per dare spazio a ciò che altrimenti resterebbe dentro.
    en: Part of my work emerges from what I observe, experience and feel, and from an urgent need to find a form through which to express it externally. At present, I mainly explore three forms of expression to give space to what might otherwise remain within.
